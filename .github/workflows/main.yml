name: CI

on:
    push:
        branches: [develop]
    pull_request:
        branches: [develop]

jobs:
    build-and-test:
        runs-on: ${{ matrix.os }}

        # Minimal coverage: current LTS on both OSes, next LTS on the
        # primary OS. Drops the Node 20 lane (EOL April 2026) — we no
        # longer promise Node 20 support (engines.node = >=22).
        strategy:
            fail-fast: false
            matrix:
                include:
                    - node-version: 22.x
                      os: ubuntu-latest
                    - node-version: 22.x
                      os: windows-latest
                    - node-version: 24.x
                      os: ubuntu-latest

        steps:
            - uses: actions/checkout@v5

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Cache node modules
              uses: actions/cache@v5
              with:
                  path: node_modules
                  key: ${{ runner.OS }}-build-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.OS }}-build-${{ env.cache-name }}-
                      ${{ runner.OS }}-build-
                      ${{ runner.OS }}-

            - name: Install Dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Unit tests
              run: npm run test:unit

            - name: Lint
              if: ${{ matrix.node-version == '24.x' && matrix.os == 'ubuntu-latest' }}
              run: npm run lint

            - name: Type check
              if: ${{ matrix.node-version == '24.x' && matrix.os == 'ubuntu-latest' }}
              run: npm run typecheck

    e2e:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5

            - name: Use Node.js 22.x
              uses: actions/setup-node@v5
              with:
                  node-version: 22.x

            - name: Cache node modules
              uses: actions/cache@v5
              with:
                  path: node_modules
                  key: ${{ runner.OS }}-build-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.OS }}-build-${{ env.cache-name }}-
                      ${{ runner.OS }}-build-
                      ${{ runner.OS }}-

            - name: Install Dependencies
              run: npm ci

            - name: Build
              run: npm run build

            # Per-push e2e only runs chromium-engine projects (chrome, todomvc,
            # standalone — see step below). Firefox and webkit are nightly via
            # e2e-cross-browser.yml. Restricting `playwright install` to
            # `chromium` here saves ~6-8 minutes per CI run on cold-cache
            # runners (full install pulls all three engines + apt deps).
            - name: Install Playwright Browsers
              run: npx playwright install --with-deps chromium

            # Per-push e2e: only the chromium-class browser + the two
            # fixture-specific projects. Firefox and webkit run nightly via
            # .github/workflows/e2e-cross-browser.yml — cross-engine
            # regressions in a static-HTML doc generator are rare and the
            # nightly catches them without slowing every push by ~6 minutes.
            - name: E2E tests (chrome + fixtures)
              run: npx playwright test --project=chrome --project=todomvc --project=standalone
