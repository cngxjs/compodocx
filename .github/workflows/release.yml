name: Release

# Triggers when a tag matching v* (e.g. v0.0.1, v0.1.0, v1.0.0-beta.2) is pushed.
# Build → unit tests → npm publish to public registry under @cngxjs scope.
#
# Authentication: OIDC via npm Trusted Publisher.
# The @cngxjs/compodocx package on npm is configured (Settings →
# Trusted Publisher) to trust the cngxjs/compodocx repo's release.yml
# workflow. The npm CLI picks up the GitHub Actions OIDC token
# automatically when this workflow runs `npm publish` and exchanges it
# for a short-lived publish credential. No NPM_TOKEN, no long-lived
# secret to leak or rotate.
#
# To release: bump package.json version, commit, tag, push tag.
#   npm version 0.0.3          # writes package.json + creates v0.0.3 commit + tag
#   git push origin develop --follow-tags
# Or via release-it (see .release-it.json):
#   npx release-it patch       # interactive bump + tag + push
#
# This workflow does NOT create the tag - it only reacts to tag pushes.
#
# Safety guards: the publish step is gated on the main CI workflow having
# already passed on the same commit (4-OS x 2-node-matrix + e2e), and on
# `npm run lint` passing inside this workflow. Together they make sure no
# broken artifact ever reaches npm.

on:
    push:
        tags:
            - 'v*'

# Provenance attestations require the workflow to write OIDC tokens.
permissions:
    contents: read
    id-token: write
    # `wait-on-check-action` queries the Checks API on the same SHA.
    checks: read

jobs:
    publish:
        name: Build and publish to npm
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5

            # Block publish until the main CI workflow has succeeded on the
            # same commit. Tags are usually pushed milliseconds after the
            # commit they point at, so the CI workflow is normally still
            # running when the release workflow starts. Without this gate the
            # release races CI and could publish a commit that fails on
            # Windows / Node 20 / lint / e2e. Wait-interval is 30s; the
            # action times out after 30 minutes by default.
            - name: Wait for main CI to succeed on this commit
              uses: lewagon/wait-on-check-action@v1.7.0
              with:
                  ref: ${{ github.sha }}
                  running-workflow-name: 'Build and publish to npm'
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
                  wait-interval: 30
                  allowed-conclusions: success

            # Node 24 ships with npm >= 11.5.1 which is required for the
            # Trusted Publisher (OIDC) flow that exchanges the GitHub Actions
            # OIDC token for a short-lived publish credential. Node 22 ships
            # with npm 10.x which silently falls back to anonymous publish
            # and the registry responds with a misleading 404.
            - name: Use Node.js 24.x
              uses: actions/setup-node@v5
              with:
                  node-version: 24.x
                  registry-url: 'https://registry.npmjs.org/'
                  scope: '@cngxjs'

            - name: Cache node modules
              uses: actions/cache@v5
              with:
                  path: node_modules
                  key: ${{ runner.OS }}-release-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.OS }}-release-
                      ${{ runner.OS }}-build-

            - name: Install Dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Build
              run: npm run build

            - name: Unit tests
              run: npm run test:unit

            - name: Verify tag matches package.json version
              run: |
                  PKG_VERSION=$(node -p "require('./package.json').version")
                  TAG_VERSION="${GITHUB_REF_NAME#v}"
                  if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
                      echo "::error::Tag $GITHUB_REF_NAME (version $TAG_VERSION) does not match package.json version $PKG_VERSION"
                      exit 1
                  fi
                  echo "Tag and package.json agree on $PKG_VERSION"

            - name: Show what would be published
              run: npm pack --dry-run

            - name: Publish to npm (OIDC via Trusted Publisher)
              run: npm publish --access public --provenance

            # After publish, kick the marketing site so its npm-version badge,
            # release-date pill and weekly-downloads counter pick up the new
            # version on next paint. The website's deploy.yml also re-runs
            # `sync:tokens` against the new tag so the vendored CSS tracks the
            # released library version (auto-commits with `[skip ci]`).
            #
            # Requires repo secret WEBSITE_DISPATCH_TOKEN - a PAT with
            # `repo` scope (classic) or `Actions: write` + `Contents: write`
            # (fine-grained, scoped to cngxjs/compodocx-website only).
            - name: Trigger compodocx-website rebuild
              if: success()
              uses: peter-evans/repository-dispatch@v4
              with:
                  token: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
                  repository: cngxjs/compodocx-website
                  event-type: compodocx-released
                  client-payload: |
                      {
                        "version": "${{ github.ref_name }}",
                        "sha": "${{ github.sha }}"
                      }
